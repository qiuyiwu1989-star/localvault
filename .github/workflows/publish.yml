name: 发布到 npm

# 为什么把发布放在 CI 里，而不是「谁在本地跑一条 npm publish」：
#
# 发布令牌是一个**能代表你身份写公开包**的凭据。放在 GitHub 的
# repository secret 里，它只在这一条 workflow 的一次运行中、以环境变量的形式
# 存在几十秒；不落盘、不进对话记录、不进 shell 历史、不用发给任何人。
#
# 本地手动发布至少要经过：拿到明文令牌 → 写进某处 → 用完再删。
# 中间任何一步（剪贴板、终端历史、聊天记录、截图）都可能把它漏出去。
# 少一次经手，就少一个漏点。
#
# 触发方式两种，都要人主动点一下 —— 不设「push 即发布」。
# 打 tag 或合并都不该让一个公开的包悄悄更新。

on:
  # 手动触发（推荐）。可以选先干跑一次看清楚要发什么。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只干跑（npm publish --dry-run），不真的发布'
        type: boolean
        default: true
  # 也可以在 GitHub 上发一个 Release 来触发。
  release:
    types: [published]

permissions:
  contents: read
  # npm 的「来源证明」（provenance）需要它：让 npm 上的包页显示
  # 「这个包是在这条 workflow、这个 commit 上构建的」。
  # 对一个主打「索引不出机器」的工具来说，这一条比加速下载更有意义。
  id-token: write

jobs:
  publish:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 报告要发布的东西
        run: |
          echo "包名与版本："
          node -p "const p=require('./package.json'); p.name + '@' + p.version"
          echo ""
          echo "将被打包的文件："
          npm pack --dry-run 2>&1 | tail -30

      - name: 发布前先跑全部测试
        # 发布是单向的：npm 不允许覆盖已发布的版本号（`npm unpublish` 有严格限制）。
        # 所以「先测试再发布」不是流程洁癖，是因为**发出去就收不回来**。
        run: npm test

      - name: 检查 secret 在不在
        # 缺 secret 时给出人话，而不是让 npm 抛一个 E401 让人去猜。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::仓库 secret 里没有 NPM_TOKEN，或者它的值是空的。"
            echo "去 Settings → Secrets and variables → Actions 加一个，"
            echo "值必须是 npmjs.com 上生成的令牌，不是这个页面的示例占位符。"
            exit 1
          fi

      - name: 干跑（不发布）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --dry-run --provenance --access public

      - name: 真的发布
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: 发布结果
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          echo "已发布。确认一下："
          sleep 5
          npm view "$(node -p "require('./package.json').name")" version dist.tarball 2>&1 || true
