name: 发布到 npm

# ── 为什么是「提交待审」，而不是直接发布 ────────────────────────────
#
# npm 在 2026-07 收紧了凭据：带 bypass-2FA 的 granular token 不能再用来自动
# 直接发布（2027-01 起彻底失效，官方让你改用 trusted publishing 或 staged）。
# 实测直接发布会被挡回来：
#
#     403 Two-factor authentication or granular access token with bypass 2fa
#         enabled is required to publish packages.
#
# 而 `npm stage publish` 是 npm 为此给的出路，文档原话：
#
#   - **不需要 2FA**（"npm stage publish does not require 2FA"）
#   - **新包也支持**（"for both new and existing packages"；包不存在时
#     先落一个 `0.0.0-stage` 占位版本）
#   - 需要 npm CLI ≥11.15.0、Node ≥22.14
#
# 于是令牌只够「提交」，不够「上线」。**上线必须有人在 npmjs.com 上
# 用 2FA 点一次 Approve。** 一道自动流水线上，这一步人为确认不是麻烦，
# 是它唯一的价值所在 —— 尤其对一个要往 npm 写公开包的工具。
#
# 为什么不用可信发布（OIDC，完全不要令牌）：
# 它要在 **npm 上的包设置页**配置，而包还不存在，没有那一页。
# 等 1.1.1 上线后就可切过去，届时这个 secret 可以删掉。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '做什么'
        type: choice
        default: stage
        options:
          - stage        # 提交待审（默认，最安全）
          - dry_run      # 只干跑，什么都不提交
          - direct       # 直接发布（需要 bypass-2FA 令牌，npm 正在淘汰）
  release:
    types: [published]

permissions:
  contents: read
  # npm 的「来源证明」（provenance）需要它：npm 包页会显示
  # 「这个包是在这条 workflow、这个 commit 上构建的」。
  # 对一个主打「索引不出机器」的工具，这一条比加速下载更有意义。
  id-token: write

jobs:
  publish:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 报告要发布的东西
        run: |
          echo "包名与版本："
          node -p "const p=require('./package.json'); p.name + '@' + p.version"
          echo ""
          echo "将被打包的文件："
          npm pack --dry-run 2>&1 | tail -30

      - name: 发布前先跑全部测试
        # 发布是单向的：npm 不允许覆盖已发布的版本号。
        # 所以「先测试再发布」不是流程洁癖，是因为**发出去就收不回来**。
        run: npm test

      - name: 检查 secret 在不在
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::仓库 secret 里没有 NPM_TOKEN，或者它的值是空的。"
            echo "去 Settings → Secrets and variables → Actions 加一个，"
            echo "值必须是 npmjs.com 上生成的令牌，不是那个页面的示例占位符。"
            exit 1
          fi

      - name: 确认 npm 没有偷偷改我们的发布清单
        # `npm test` 里已有一条同名检查（会真跑一次 --dry-run）。这里再挡一次是故意的：
        # 测试可能被人从链子上摘掉，而这一条在发布这条路上，摘不掉。
        #
        # 背景：`"bin": {"localvault": "./cli.js"}` 里那个 `./` 会被 npm 判为
        # invalid 并从清单里删掉 —— 装完没有任何命令可跑，而这条警告
        # **只在 publish 时出现，npm pack 不报**。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          OUT="$(npm publish --dry-run --access public 2>&1 || true)"
          echo "$OUT"
          if echo "$OUT" | grep -qi 'auto-corrected\|was invalid and removed'; then
            echo "::error::npm 改动了我们的发布清单，上面 warn publish 那几行就是它改了什么。"
            echo "改到 bin 上意味着包发出去后**装完没有任何命令**。先修 package.json 再发。"
            exit 1
          fi

      # ── 三条路，只走一条 ──────────────────────────────────────────
      - name: 干跑（什么都不提交）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry_run' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --dry-run --provenance --access public

      - name: 提交待审（stage）
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'stage') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm stage publish --provenance --access public
          echo ""
          echo "== 当前待审列表 =="
          npm stage list || true

      - name: 直接发布（deprecated 路线）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'direct' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::warning::direct 路线需要 bypass-2FA 令牌，npm 正在淘汰它（2027-01 起失效）。"
          echo "::warning::除非确认需要，请用 stage。"
          npm publish --provenance --access public

      - name: 下一步要人做什么
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'stage') }}
        run: |
          {
            echo "## 已提交待审，还差最后一步"
            echo ""
            echo "这个包**还没有上线**。需要你本人用 2FA 批准一次："
            echo ""
            echo "1. 打开 https://www.npmjs.com/ → 头像 → **Staged Packages**"
            echo "2. 找到 \`$(node -p "require('./package.json').name")\`，点 **Approve**"
            echo "3. 按提示输 2FA 验证码"
            echo ""
            echo "批准之后，这个版本才会出现在 registry 上。"
            echo ""
            echo "> 首次发布时 npm 会先落一个 \`0.0.0-stage\` 占位版本 —— 那是正常的，"
            echo "> 真正的内容要等你批准才公开。"
          } >> "$GITHUB_STEP_SUMMARY"
